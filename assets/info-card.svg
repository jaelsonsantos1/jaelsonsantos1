<svg xmlns="http://www.w3.org/2000/svg" width="490" height="410" viewBox="0 0 490 410" role="img" aria-labelledby="title desc">
  <title id="title">Jaelson Santos profile information</title>
  <desc id="desc">Animated terminal-style developer profile card</desc>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 16px; }
    .key { fill: #8b949e; }
    .value { fill: #f0f6fc; }
    .accent { fill: #58a6ff; }
    .green { fill: #3fb950; }
    .row { opacity: 0; animation: show .35s ease forwards; }
    .r1 { animation-delay: .20s; } .r2 { animation-delay: .45s; }
    .r3 { animation-delay: .70s; } .r4 { animation-delay: .95s; }
    .r5 { animation-delay: 1.20s; } .r6 { animation-delay: 1.45s; }
    .r7 { animation-delay: 1.70s; } .r8 { animation-delay: 1.95s; }
    .cursor { animation: blink 1s steps(2, start) infinite; }
    @keyframes show { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <text x="20" y="38" class="mono green row r1">jaelson@github</text>
  <text x="20" y="67" class="mono key row r2">------------------------------</text>

  <text x="20" y="108" class="mono key row r3">Role</text>
  <text x="135" y="108" class="mono value row r3">Full Stack Developer</text>

  <text x="20" y="147" class="mono key row r4">Focus</text>
  <text x="135" y="147" class="mono value row r4">Backend · Automation</text>

  <text x="20" y="186" class="mono key row r5">Stack</text>
  <text x="135" y="186" class="mono value row r5">Python · Go · TypeScript</text>

  <text x="20" y="225" class="mono key row r6">Web</text>
  <text x="135" y="225" class="mono value row r6">Django · React · Next.js</text>

  <text x="20" y="264" class="mono key row r7">Infra</text>
  <text x="135" y="264" class="mono value row r7">Docker · CI/CD · Nginx</text>

  <text x="20" y="303" class="mono key row r8">Observe</text>
  <text x="135" y="303" class="mono value row r8">Grafana · OTel · Prometheus</text>

  <text x="20" y="354" class="mono accent row r8">Building reliable software.</text>
  <rect x="20" y="378" width="10" height="18" rx="1" class="green cursor"/>
</svg>
